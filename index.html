<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화장실 찾기 서비스</title>

  <style>
    /* 기본 여백 제거 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }

    /* 화면 2분할: 왼쪽(탭+리스트) + 오른쪽(지도) */
    #container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* 왼쪽 영역 */
    #sidebar {
      width: 360px;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ddd;
      background: #ffffff;
    }

    /* 탭 버튼 영역 */
    #tabBar {
      display: flex;
      border-bottom: 2px solid #eee;
    }

    .tab-button {
      flex: 1;
      padding: 14px 8px;
      font-size: 15px;
      color: #666;
      background: #fafafa;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
    }

    .tab-button.active {
      color: #2563eb;
      font-weight: bold;
      background: #ffffff;
      border-bottom-color: #2563eb;
    }

    /* 엑셀 파일 선택 영역 (탭 1에서만 보임) */
    #excelBar {
      display: none;
      padding: 10px 14px;
      font-size: 13px;
      background: #f8fafc;
      border-bottom: 1px solid #eee;
    }

    #excelBar.visible {
      display: block;
    }

    #excelStatus {
      margin-top: 6px;
      color: #2563eb;
    }

    /* 지역명 검색창 (탭 2에서만 보임) */
    #searchForm {
      display: none;
      gap: 6px;
      padding: 12px 14px;
      border-bottom: 1px solid #eee;
    }

    #searchForm.visible {
      display: flex;
    }

    #regionInput {
      flex: 1;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    #searchButton {
      padding: 10px 16px;
      font-size: 15px;
      color: #fff;
      background: #3b82f6;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #searchButton:hover {
      background: #2563eb;
    }

    /* 검색 결과 리스트 (넘치면 스크롤) */
    #resultList {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    #resultList li {
      padding: 12px 14px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }

    #resultList li:hover {
      background: #f5f8ff;
    }

    .place-name {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .place-address {
      font-size: 13px;
      color: #666;
    }

    .place-extra {
      font-size: 12px;
      color: #3b82f6;
      margin-top: 2px;
    }

    .message {
      padding: 20px 14px;
      color: #888;
      font-size: 14px;
      cursor: default;
    }

    /* 페이지 번호 */
    #pagination {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 10px;
      border-top: 1px solid #eee;
    }

    #pagination:empty {
      display: none;
    }

    #pagination a {
      padding: 4px 9px;
      font-size: 13px;
      color: #333;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
    }

    #pagination a.current {
      color: #fff;
      background: #3b82f6;
      border-color: #3b82f6;
      font-weight: bold;
      cursor: default;
    }

    /* 오른쪽 지도 영역 */
    #mapArea {
      position: relative;
      flex: 1;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 로드뷰 패널 (지도 아래쪽에 겹쳐서 표시) */
    #roadviewPanel {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 50%;
      z-index: 10;
      background: #000;
      border-top: 3px solid #2563eb;
    }

    #roadviewPanel.visible {
      display: block;
    }

    #roadview {
      width: 100%;
      height: 100%;
    }

    #roadviewClose {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 11;
      padding: 6px 12px;
      font-size: 13px;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #fff;
      border-radius: 4px;
      cursor: pointer;
    }

    #roadviewMessage {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      text-align: center;
      color: #fff;
      font-size: 15px;
    }

    /* 마커 팝업 (말풍선) 안쪽 스타일 */
    .popup {
      width: 250px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.5;
    }

    .popup-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 2px;
    }

    .popup-address {
      color: #666;
      margin-bottom: 4px;
    }

    .popup-hours {
      color: #444;
      margin-bottom: 8px;
    }

    .popup-section {
      margin-top: 8px;
      font-weight: bold;
    }

    .stall-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
    }

    .stall {
      width: 24px;
      height: 24px;
      line-height: 24px;
      text-align: center;
      font-size: 12px;
      color: #fff;
      border-radius: 4px;
    }

    .stall.free {
      background: #22c55e;
    }

    .stall.busy {
      background: #ef4444;
    }

    .popup-note {
      margin-top: 8px;
      font-size: 11px;
      color: #999;
    }

    .popup-roadview {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      font-size: 13px;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="container">
    <!-- 왼쪽: 탭 + 검색창 + 결과 리스트 -->
    <div id="sidebar">
      <div id="tabBar">
        <button class="tab-button active" id="tabGoyang">고양시 확인</button>
        <button class="tab-button" id="tabRegion">지역명으로 검색</button>
      </div>

      <!-- 탭 1 에서만 보이는 엑셀 파일 선택 -->
      <div id="excelBar" class="visible">
        <div>공중화장실현황 엑셀 파일을 직접 고를 수도 있어요</div>
        <input id="excelInput" type="file" accept=".xls,.xlsx">
        <div id="excelStatus">엑셀 데이터를 불러오는 중...</div>
      </div>

      <!-- 탭 2 에서만 보이는 검색창 -->
      <div id="searchForm">
        <input id="regionInput" type="text" placeholder="지역명 입력 (예: 강남역)">
        <button id="searchButton">검색</button>
      </div>

      <ul id="resultList">
        <li class="message">위치를 확인하는 중이에요...</li>
      </ul>
      <div id="pagination"></div>
    </div>

    <!-- 오른쪽: 지도 + 로드뷰 -->
    <div id="mapArea">
      <div id="map"></div>
      <div id="roadviewPanel">
        <button id="roadviewClose">로드뷰 닫기 ✕</button>
        <div id="roadviewMessage"></div>
        <div id="roadview"></div>
      </div>
    </div>
  </div>

  <!-- 엑셀 파일을 읽기 위한 라이브러리 (SheetJS) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!--
    카카오 지도 SDK
    - autoload=false : 아래에서 kakao.maps.load()로 직접 실행 (로딩 오류 방지)
    - libraries=services : 장소 검색 기능에 필요
  -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=654464dfc5d446f2196b6b0a69e4ba29&libraries=services&autoload=false"></script>

  <script>
    // ============================================================
    // 1. 설정값
    // ============================================================

    // index.html 과 같은 폴더에 두면 자동으로 읽는 엑셀 파일 이름
    var EXCEL_FILE_NAME = "공중화장실현황_제공표준_.xls";

    // 지도 레벨 (숫자가 작을수록 확대됨)
    var MAP_LEVEL = 5;

    // 위치 권한을 못 받았을 때 쓸 기본 위치 (고양시청 근처)
    var DEFAULT_LAT = 37.6584;
    var DEFAULT_LNG = 126.8320;

    // 탭 1에서 보여줄 가까운 화장실 개수
    var NEARBY_COUNT = 30;

    // 학교로 판단할 글자들 (이 글자가 들어간 화장실은 제외)
    var SCHOOL_PATTERN = /학교|초등|중학|고등|대학교|유치원/;

    // 엑셀이 없을 때 카카오에서 차례로 검색할 단어들
    var FALLBACK_KEYWORDS = ["공중화장실", "개방화장실", "화장실"];

    // ============================================================
    // 2. 전역 변수
    // ============================================================
    var map = null;              // 지도 객체
    var placesService = null;    // 장소 검색 객체
    var infoWindow = null;       // 마커 클릭 시 뜨는 말풍선
    var roadview = null;         // 로드뷰 객체
    var roadviewClient = null;   // 로드뷰 위치 찾기 객체
    var markers = [];            // 지도 위의 마커 목록
    var currentPosition = null;  // 현재 위치 (kakao.maps.LatLng)
    var currentTab = "goyang";   // 현재 선택된 탭 ("goyang" 또는 "region")
    var searchCounter = 0;       // 탭을 빨리 바꿀 때 이전 결과가 섞이지 않게 막는 번호
    var shownIds = {};           // 카카오 검색에서 이미 보여준 장소 (중복 방지)

    // 고양시 화장실 데이터
    // 순서: [이름, 주소, 위도, 경도, 남성 대변기 수, 여성 대변기 수, 개방시간]
    var GOYANG_TOILETS = [];
    var dataStatus = "loading";  // "loading"(읽는 중) / "loaded"(성공) / "missing"(없음)

    // ============================================================
    // 3. 시작: SDK가 완전히 로드된 뒤에 실행
    // ============================================================
    if (typeof kakao === "undefined") {
      // SDK 파일 자체를 못 불러온 경우 안내
      document.getElementById("map").innerHTML =
        "<p style='padding:20px;color:#c00;'>카카오 SDK를 불러오지 못했어요.<br>" +
        "1) 카카오 디벨로퍼스에 Web 도메인 등록<br>" +
        "2) 카카오맵 사용 설정 ON<br>" +
        "3) F12 → Network 탭에서 sdk.js 상태 확인</p>";
    } else {
      kakao.maps.load(function () {
        initMap();
      });
    }

    // 지도 초기화
    function initMap() {
      var defaultPosition = new kakao.maps.LatLng(DEFAULT_LAT, DEFAULT_LNG);

      map = new kakao.maps.Map(document.getElementById("map"), {
        center: defaultPosition,
        level: MAP_LEVEL
      });

      placesService = new kakao.maps.services.Places();
      infoWindow = new kakao.maps.InfoWindow({ zIndex: 5, removable: true });
      roadviewClient = new kakao.maps.RoadviewClient();
      roadview = new kakao.maps.Roadview(document.getElementById("roadview"));

      // 이벤트 연결
      document.getElementById("tabGoyang").addEventListener("click", function () {
        switchTab("goyang");
      });
      document.getElementById("tabRegion").addEventListener("click", function () {
        switchTab("region");
      });
      document.getElementById("searchButton").addEventListener("click", searchRegion);
      document.getElementById("regionInput").addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          searchRegion();
        }
      });
      document.getElementById("roadviewClose").addEventListener("click", closeRoadview);
      document.getElementById("excelInput").addEventListener("change", handleExcelSelect);

      // 엑셀 자동 불러오기 + 현재 위치 요청을 함께 시작
      loadExcelAuto();
      requestCurrentLocation();
    }

    // ============================================================
    // 4. 엑셀 데이터 불러오기
    // ============================================================

    // 같은 폴더의 엑셀 파일을 자동으로 읽기 (Live Server / 웹 서버에서 동작)
    function loadExcelAuto() {
      if (typeof XLSX === "undefined") {
        setDataMissing("엑셀 라이브러리를 불러오지 못했어요.");
        return;
      }

      fetch(encodeURI(EXCEL_FILE_NAME))
        .then(function (response) {
          if (!response.ok) {
            throw new Error("파일을 찾지 못했어요");
          }
          return response.arrayBuffer();
        })
        .then(function (buffer) {
          applyExcelData(buffer);
        })
        .catch(function () {
          setDataMissing("같은 폴더에서 엑셀을 찾지 못했어요. 위의 '파일 선택'을 눌러 주세요.");
        });
    }

    // 사용자가 '파일 선택'으로 엑셀을 고른 경우
    function handleExcelSelect(event) {
      var file = event.target.files[0];
      if (!file) {
        return;
      }
      if (typeof XLSX === "undefined") {
        setDataMissing("엑셀 라이브러리를 불러오지 못했어요.");
        return;
      }

      document.getElementById("excelStatus").textContent = "엑셀 데이터를 읽는 중...";

      var reader = new FileReader();
      reader.onload = function (loadEvent) {
        applyExcelData(loadEvent.target.result);
      };
      reader.readAsArrayBuffer(file);
    }

    // 엑셀 내용을 읽어서 고양시 화장실 목록을 만들고 화면을 다시 그림
    function applyExcelData(buffer) {
      try {
        GOYANG_TOILETS = parseExcel(buffer);
      } catch (error) {
        console.log("엑셀 읽기 오류:", error);
        setDataMissing("엑셀을 읽는 중 오류가 났어요.");
        return;
      }

      if (GOYANG_TOILETS.length === 0) {
        setDataMissing("엑셀에서 고양시 화장실을 찾지 못했어요.");
        return;
      }

      dataStatus = "loaded";
      document.getElementById("excelStatus").textContent =
        "고양시 화장실 " + GOYANG_TOILETS.length + "곳을 불러왔어요 (학교 제외)";
      refreshGoyangTab();
    }

    // 엑셀을 못 읽었을 때
    function setDataMissing(message) {
      dataStatus = "missing";
      document.getElementById("excelStatus").textContent = message;
      refreshGoyangTab();
    }

    // 지금 탭 1을 보고 있으면 다시 그리기
    function refreshGoyangTab() {
      if (currentTab === "goyang" && currentPosition) {
        switchTab("goyang");
      }
    }

    // 엑셀 파일(buffer)에서 고양시 화장실만 뽑아 배열로 만들기
    function parseExcel(buffer) {
      var workbook = XLSX.read(buffer, { type: "array" });
      var sheet = workbook.Sheets[workbook.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });

      var result = [];

      for (var i = 0; i < rows.length; i++) {
        var row = rows[i];

        var name = String(row["화장실명"]);
        var roadAddress = String(row["소재지도로명주소"]);
        var jibunAddress = String(row["소재지지번주소"]);
        var manager = String(row["관리기관명"]);

        // 고양시 화장실만 사용
        if (roadAddress.indexOf("고양시") === -1 && jibunAddress.indexOf("고양시") === -1) {
          continue;
        }

        // 학교 화장실은 제외
        if (SCHOOL_PATTERN.test(name) || SCHOOL_PATTERN.test(jibunAddress) || SCHOOL_PATTERN.test(manager)) {
          continue;
        }

        // 좌표가 없는 곳은 지도에 표시할 수 없어서 제외
        var lat = parseFloat(row["위도"]);
        var lng = parseFloat(row["경도"]);
        if (isNaN(lat) || isNaN(lng)) {
          continue;
        }

        // 대변기 수 (일반 + 장애인용 + 어린이용)
        var male = toNumber(row["남성용-대변기수"]) +
                   toNumber(row["남성용-장애인용대변기수"]) +
                   toNumber(row["남성용-어린이용대변기수"]);
        var female = toNumber(row["여성용-대변기수"]) +
                     toNumber(row["여성용-장애인용대변기수"]) +
                     toNumber(row["여성용-어린이용대변기수"]);

        var address = roadAddress !== "" ? roadAddress : jibunAddress;

        result.push([name, address, lat, lng, male, female, String(row["개방시간"])]);
      }

      return result;
    }

    // 값을 숫자로 바꾸기 (빈 칸이나 글자는 0)
    function toNumber(value) {
      var number = parseInt(value, 10);
      return isNaN(number) ? 0 : number;
    }

    // ============================================================
    // 5. 현재 위치
    // ============================================================
    function requestCurrentLocation() {
      // 위치 기능을 지원하지 않는 브라우저
      if (!navigator.geolocation) {
        currentPosition = new kakao.maps.LatLng(DEFAULT_LAT, DEFAULT_LNG);
        switchTab("goyang");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        // 성공했을 때
        function (position) {
          currentPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );
          map.setLevel(MAP_LEVEL);
          map.setCenter(currentPosition);
          switchTab("goyang");
        },
        // 실패했을 때 (권한 거부 등)
        function (error) {
          console.log("위치 정보를 가져오지 못했어요:", error.message);
          currentPosition = new kakao.maps.LatLng(DEFAULT_LAT, DEFAULT_LNG);
          alert("위치 권한이 없어서 기본 위치(고양시)로 표시할게요.");
          switchTab("goyang");
        }
      );
    }

    // ============================================================
    // 6. 탭 전환
    // ============================================================
    function switchTab(tabName) {
      currentTab = tabName;
      searchCounter++;

      // 탭 버튼 모양 바꾸기
      document.getElementById("tabGoyang").classList.toggle("active", tabName === "goyang");
      document.getElementById("tabRegion").classList.toggle("active", tabName === "region");

      // 탭마다 필요한 입력 영역만 보이게
      document.getElementById("excelBar").classList.toggle("visible", tabName === "goyang");
      document.getElementById("searchForm").classList.toggle("visible", tabName === "region");

      // 기존 마커, 리스트, 말풍선, 로드뷰를 모두 지움
      clearAll();

      if (tabName === "goyang") {
        showNearbyGoyangToilets();
      } else {
        showMessage("지역명을 입력하고 검색 버튼을 눌러 보세요.");
        document.getElementById("regionInput").focus();
      }
    }

    // 마커, 리스트, 페이지 번호, 말풍선, 로드뷰 모두 지우기
    function clearAll() {
      for (var i = 0; i < markers.length; i++) {
        markers[i].setMap(null);
      }
      markers = [];
      shownIds = {};
      infoWindow.close();
      closeRoadview();
      document.getElementById("resultList").innerHTML = "";
      document.getElementById("pagination").innerHTML = "";
    }

    // ============================================================
    // 7. 탭 1: 내 위치 주변의 고양시 화장실
    // ============================================================
    function showNearbyGoyangToilets() {
      if (!currentPosition) {
        showMessage("위치를 확인하는 중이에요...");
        return;
      }

      // 엑셀을 아직 읽는 중이면 기다림 (다 읽으면 자동으로 다시 그려요)
      if (dataStatus === "loading") {
        showMessage("엑셀 데이터를 불러오는 중이에요...");
        return;
      }

      var bounds = new kakao.maps.LatLngBounds();
      bounds.extend(currentPosition);

      // 엑셀 데이터가 없으면 카카오 검색으로 대신 보여줌
      if (GOYANG_TOILETS.length === 0) {
        showMessage("※ 엑셀 데이터가 없어서 카카오 검색 결과로 보여줘요.");
        runFallbackSearch(0, bounds, searchCounter);
        return;
      }

      var myLat = currentPosition.getLat();
      var myLng = currentPosition.getLng();

      // 각 화장실까지의 거리를 계산해서 가까운 순으로 정렬
      var withDistance = GOYANG_TOILETS.map(function (toilet) {
        return {
          data: toilet,
          distance: calcDistance(myLat, myLng, toilet[2], toilet[3])
        };
      });

      withDistance.sort(function (a, b) {
        return a.distance - b.distance;
      });

      var nearby = withDistance.slice(0, NEARBY_COUNT);

      for (var i = 0; i < nearby.length; i++) {
        var item = nearby[i];
        var place = {
          name: item.data[0],
          address: item.data[1],
          lat: item.data[2],
          lng: item.data[3],
          maleStalls: item.data[4],
          femaleStalls: item.data[5],
          hours: item.data[6],
          distance: item.distance
        };
        addPlace(place, bounds);
      }

      map.setBounds(bounds);
    }

    // 엑셀이 없을 때: 카카오 검색을 여러 단어로 차례로 실행해서 결과를 모음
    function runFallbackSearch(keywordIndex, bounds, myCounter) {
      if (keywordIndex >= FALLBACK_KEYWORDS.length) {
        return;
      }

      var options = {
        location: currentPosition,
        radius: 10000,
        sort: kakao.maps.services.SortBy.DISTANCE
      };

      placesService.keywordSearch(FALLBACK_KEYWORDS[keywordIndex], function (data, status, pagination) {
        // 검색 중에 탭을 바꿨다면 결과를 버림
        if (myCounter !== searchCounter || currentTab !== "goyang") {
          return;
        }

        // 결과가 없거나 오류면 다음 검색어로
        if (status !== kakao.maps.services.Status.OK) {
          runFallbackSearch(keywordIndex + 1, bounds, myCounter);
          return;
        }

        var myLat = currentPosition.getLat();
        var myLng = currentPosition.getLng();

        for (var i = 0; i < data.length; i++) {
          // 같은 장소를 두 번 보여주지 않기
          if (shownIds[data[i].id]) {
            continue;
          }
          shownIds[data[i].id] = true;

          var lat = parseFloat(data[i].y);
          var lng = parseFloat(data[i].x);
          var place = {
            name: data[i].place_name,
            address: data[i].road_address_name || data[i].address_name,
            lat: lat,
            lng: lng,
            maleStalls: 0,      // 0 이면 시뮬레이션에서 임의로 정함
            femaleStalls: 0,
            hours: "",
            distance: calcDistance(myLat, myLng, lat, lng)
          };
          addPlace(place, bounds);
        }
        map.setBounds(bounds);

        // 같은 검색어의 다음 페이지(최대 3페이지), 끝나면 다음 검색어
        if (pagination.current < Math.min(pagination.last, 3)) {
          pagination.gotoPage(pagination.current + 1);
        } else {
          runFallbackSearch(keywordIndex + 1, bounds, myCounter);
        }
      }, options);
    }

    // 두 지점 사이의 거리를 m 단위로 계산 (하버사인 공식)
    function calcDistance(lat1, lng1, lat2, lng2) {
      var earthRadius = 6371000;
      var toRad = Math.PI / 180;
      var dLat = (lat2 - lat1) * toRad;
      var dLng = (lng2 - lng1) * toRad;
      var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) *
              Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return earthRadius * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // 거리를 보기 좋은 글자로 바꾸기
    function formatDistance(meters) {
      if (meters < 1000) {
        return Math.round(meters) + "m";
      }
      return (meters / 1000).toFixed(1) + "km";
    }

    // ============================================================
    // 8. 탭 2: 지역명으로 검색 (카카오 장소 검색)
    // ============================================================
    function searchRegion() {
      var region = document.getElementById("regionInput").value.trim();

      if (region === "") {
        alert("지역명을 입력해 주세요!");
        return;
      }

      clearAll();
      searchCounter++;
      var myCounter = searchCounter;

      // 카카오 키워드 검색: "지역명 + 공중화장실"
      placesService.keywordSearch(
        region + " 공중화장실",
        function (data, status, pagination) {
          // 검색 중에 탭을 바꿨다면 결과를 버림
          if (myCounter !== searchCounter || currentTab !== "region") {
            return;
          }
          handleRegionResult(data, status, pagination);
        }
      );
    }

    // 지역 검색 결과 처리
    function handleRegionResult(data, status, pagination) {
      if (status === kakao.maps.services.Status.ZERO_RESULT) {
        showMessage("검색 결과가 없어요.");
        return;
      }
      if (status !== kakao.maps.services.Status.OK) {
        showMessage("검색 중 오류가 발생했어요.");
        return;
      }

      // 페이지를 넘길 때는 이전 페이지 마커와 리스트만 지움
      clearMarkersAndList();

      var bounds = new kakao.maps.LatLngBounds();

      for (var i = 0; i < data.length; i++) {
        var place = {
          name: data[i].place_name,
          address: data[i].road_address_name || data[i].address_name,
          lat: parseFloat(data[i].y),
          lng: parseFloat(data[i].x),
          maleStalls: 0,      // 0 이면 시뮬레이션에서 임의로 정함
          femaleStalls: 0,
          hours: "",
          distance: null
        };
        addPlace(place, bounds);
      }

      map.setBounds(bounds);
      showPagination(pagination);
    }

    // 마커와 리스트만 지우기 (페이지 번호는 유지)
    function clearMarkersAndList() {
      for (var i = 0; i < markers.length; i++) {
        markers[i].setMap(null);
      }
      markers = [];
      infoWindow.close();
      document.getElementById("resultList").innerHTML = "";
    }

    // ============================================================
    // 9. 장소 하나를 지도(마커)와 리스트에 추가
    // ============================================================
    function addPlace(place, bounds) {
      var position = new kakao.maps.LatLng(place.lat, place.lng);

      var marker = new kakao.maps.Marker({
        map: map,
        position: position
      });
      markers.push(marker);
      bounds.extend(position);

      // 왼쪽 리스트 항목 만들기
      // textContent 를 쓰면 이상한 코드가 들어와도 안전해요
      var listItem = document.createElement("li");

      var nameDiv = document.createElement("div");
      nameDiv.className = "place-name";
      nameDiv.textContent = place.name;
      listItem.appendChild(nameDiv);

      var addressDiv = document.createElement("div");
      addressDiv.className = "place-address";
      addressDiv.textContent = place.address;
      listItem.appendChild(addressDiv);

      if (place.distance !== null) {
        var distanceDiv = document.createElement("div");
        distanceDiv.className = "place-extra";
        distanceDiv.textContent = "내 위치에서 " + formatDistance(place.distance);
        listItem.appendChild(distanceDiv);
      }

      document.getElementById("resultList").appendChild(listItem);

      // 마커를 누르면 팝업, 리스트를 누르면 이동 + 팝업
      kakao.maps.event.addListener(marker, "click", function () {
        openPopup(place, marker, position);
      });

      listItem.addEventListener("click", function () {
        map.panTo(position);
        openPopup(place, marker, position);
      });
    }

    // ============================================================
    // 10. 마커 팝업 (이름, 주소, 변기 사용 가능 여부 시뮬레이션)
    // ============================================================
    function openPopup(place, marker, position) {
      var popup = document.createElement("div");
      popup.className = "popup";

      // 이름
      var title = document.createElement("div");
      title.className = "popup-title";
      title.textContent = place.name;
      popup.appendChild(title);

      // 주소
      var address = document.createElement("div");
      address.className = "popup-address";
      address.textContent = place.address;
      popup.appendChild(address);

      // 개방시간 (정보가 불확실하면 '알 수 없음')
      var hours = document.createElement("div");
      hours.className = "popup-hours";
      hours.textContent = "개방시간: " + formatHours(place.hours);
      popup.appendChild(hours);

      // 변기 사용 가능 여부 시뮬레이션
      var random = makeRandom(place.name + place.address);
      var maleCount = place.maleStalls > 0 ? place.maleStalls : 2 + Math.floor(random() * 4);
      var femaleCount = place.femaleStalls > 0 ? place.femaleStalls : 2 + Math.floor(random() * 4);

      popup.appendChild(makeStallSection("남성 대변기", maleCount, random));
      popup.appendChild(makeStallSection("여성 대변기", femaleCount, random));

      // 안내 문구
      var note = document.createElement("div");
      note.className = "popup-note";
      note.textContent = "※ 사용 가능 여부는 임의로 만든 시뮬레이션이에요. (초록: 사용 가능, 빨강: 사용 중)";
      popup.appendChild(note);

      // 로드뷰 버튼
      var roadviewButton = document.createElement("button");
      roadviewButton.className = "popup-roadview";
      roadviewButton.textContent = "로드뷰 보기";
      roadviewButton.addEventListener("click", function () {
        openRoadview(position);
      });
      popup.appendChild(roadviewButton);

      infoWindow.setContent(popup);
      infoWindow.open(map, marker);
    }

    // 개방시간 글자 정리
    function formatHours(hours) {
      // 비어 있거나 ":~:" 처럼 의미 없는 값이면 알 수 없음
      if (!hours || hours.replace(/[:~\s]/g, "") === "") {
        return "알 수 없음";
      }
      return hours;
    }

    // 변기 칸 상자들을 만드는 함수
    function makeStallSection(label, count, random) {
      var wrapper = document.createElement("div");

      var maxShown = 12;                     // 너무 많으면 12칸까지만 그림
      var shownCount = Math.min(count, maxShown);
      var freeCount = 0;
      var row = document.createElement("div");
      row.className = "stall-row";

      for (var i = 1; i <= shownCount; i++) {
        var isFree = random() > 0.45;        // 약 55% 확률로 사용 가능
        if (isFree) {
          freeCount++;
        }

        var stall = document.createElement("div");
        stall.className = "stall " + (isFree ? "free" : "busy");
        stall.textContent = i;
        stall.title = i + "번 칸: " + (isFree ? "사용 가능" : "사용 중");
        row.appendChild(stall);
      }

      var heading = document.createElement("div");
      heading.className = "popup-section";
      var suffix = count > maxShown ? " (총 " + count + "칸 중 " + maxShown + "칸 표시)" : "";
      heading.textContent = label + ": " + freeCount + "/" + shownCount + " 사용 가능" + suffix;

      wrapper.appendChild(heading);
      wrapper.appendChild(row);
      return wrapper;
    }

    // 장소 이름으로 같은 난수를 만드는 함수
    // (같은 화장실은 팝업을 다시 열어도 같은 결과가 나오게 해요)
    function makeRandom(seedText) {
      var seed = 0;
      for (var i = 0; i < seedText.length; i++) {
        seed = (seed * 31 + seedText.charCodeAt(i)) % 2147483647;
      }
      return function () {
        seed = (seed * 16807) % 2147483647;
        return seed / 2147483647;
      };
    }

    // ============================================================
    // 11. 로드뷰
    // ============================================================
    function openRoadview(position) {
      var panel = document.getElementById("roadviewPanel");
      var message = document.getElementById("roadviewMessage");

      panel.classList.add("visible");
      message.textContent = "로드뷰를 불러오는 중...";

      // 마커 근처 50m 안에서 가장 가까운 로드뷰 위치를 찾음
      roadviewClient.getNearestPanoId(position, 50, function (panoId) {
        if (panoId === null) {
          message.textContent = "이 위치 근처에는 로드뷰가 없어요.";
          return;
        }
        message.textContent = "";
        roadview.setPanoId(panoId, position);
        // 패널이 막 나타났을 때 크기를 다시 계산해 줘야 화면이 제대로 보여요
        setTimeout(function () {
          roadview.relayout();
        }, 100);
      });
    }

    function closeRoadview() {
      document.getElementById("roadviewPanel").classList.remove("visible");
      document.getElementById("roadviewMessage").textContent = "";
    }

    // ============================================================
    // 12. 페이지 번호, 안내 메시지
    // ============================================================
    function showPagination(pagination) {
      var paginationEl = document.getElementById("pagination");
      paginationEl.innerHTML = "";

      if (pagination.last <= 1) {
        return;
      }

      for (var i = 1; i <= pagination.last; i++) {
        var link = document.createElement("a");
        link.textContent = i;

        if (i === pagination.current) {
          link.className = "current";
        } else {
          // 반복문 안에서 i 값을 기억하기 위해 함수로 감싸요
          link.addEventListener("click", makePageClickHandler(pagination, i));
        }

        paginationEl.appendChild(link);
      }
    }

    function makePageClickHandler(pagination, pageNumber) {
      return function () {
        pagination.gotoPage(pageNumber);
      };
    }

    // 리스트 영역에 안내 메시지 표시
    function showMessage(text) {
      var resultList = document.getElementById("resultList");
      resultList.innerHTML = "";

      var li = document.createElement("li");
      li.className = "message";
      li.textContent = text;
      resultList.appendChild(li);
    }
  </script>
</body>
