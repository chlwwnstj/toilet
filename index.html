  <style>
    /* 기본 여백 제거, 지도를 화면 전체에 */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }

    #map { width: 100%; height: 100%; }

    /* 지도 왼쪽 위 안내 상자 */
    #infoBox {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.6;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    #infoBox b { font-size: 15px; }

    #myLocationButton {
      margin-top: 8px;
      width: 100%;
      padding: 8px;
      font-size: 13px;
      color: #ffffff;
      background: #2563eb;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    /* 마커 팝업 안쪽 스타일 */
    .popup { width: 250px; padding: 12px; font-size: 13px; line-height: 1.5; }
    .popup-title { font-size: 15px; font-weight: bold; margin-bottom: 2px; }
    .popup-address { color: #666; margin-bottom: 6px; }
    .popup-section { margin-top: 8px; font-weight: bold; }
    .stall-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }

    .stall {
      width: 24px;
      height: 24px;
      line-height: 24px;
      text-align: center;
      font-size: 12px;
      color: #ffffff;
      border-radius: 4px;
    }

    .stall.free { background: #22c55e; }
    .stall.busy { background: #ef4444; }
    .popup-note { margin-top: 8px; font-size: 11px; color: #999; }
  </style>
</head>

  <div id="map"></div>

    // 압축코드를 풀어서 {이름, 위도, 경도, 남성 변기 수, 여성 변기 수} 목록으로 만들기
    function decodeToilets(dataList) {
      var result = [];
      for (var i = 0; i < dataList.length; i++) {
        var number = parseInt(dataList[i][1], 36);
        var stalls = number % 100;                 // 변기 수 (십의 자리: 남성, 일의 자리: 여성)
        var coord = Math.floor(number / 100);      // 좌표 부분
        var latOffset = Math.floor(coord / 40000);
        var lngOffset = coord % 40000;

        result.push({
          name: dataList[i][0],
          lat: 37.55 + latOffset / 100000,
          lng: 126.65 + lngOffset / 100000,
          maleStalls: Math.floor(stalls / 10),
          femaleStalls: stalls % 10,
          address: ""                              // 주소는 팝업을 열 때 카카오에서 가져와요
        });
      }
      return result;
    }

    var GOYANG_TOILETS = decodeToilets(TOILET_DATA);

    // ============================================================
    // 2. 전역 변수
    // ============================================================
    var map = null;          // 지도 객체
    var infoWindow = null;   // 마커 클릭 시 뜨는 말풍선
    var geocoder = null;     // 좌표 → 주소 변환 객체

    // ============================================================
    // 3. 시작: SDK가 완전히 로드된 뒤에 실행 (로딩 오류 방지)
    // ============================================================
    if (typeof kakao === "undefined") {
      document.getElementById("map").innerHTML =
        "<p style='padding:20px;color:#c00;'>카카오 SDK를 불러오지 못했어요.<br>" +
        "1) 카카오 디벨로퍼스 Web 플랫폼에 접속 주소(도메인) 등록<br>" +
        "2) 카카오맵 사용 설정 ON<br>" +
        "3) F12 → Network 탭에서 sdk.js 상태 확인</p>";
    } else {
      kakao.maps.load(function () {
        initMap();
      });
    }

    // 지도 만들기
    function initMap() {
      // 처음에는 고양시청 근처를 중심으로 지도를 만들어요
      map = new kakao.maps.Map(document.getElementById("map"), {
        center: new kakao.maps.LatLng(37.6584, 126.8320),
        level: 5
      });

      infoWindow = new kakao.maps.InfoWindow({ zIndex: 5, removable: true });
      geocoder = new kakao.maps.services.Geocoder();

      // 모든 화장실을 하나하나 마커로 표시
      var bounds = new kakao.maps.LatLngBounds();
      for (var i = 0; i < GOYANG_TOILETS.length; i++) {
        var marker = addToiletMarker(GOYANG_TOILETS[i]);
        bounds.extend(marker.getPosition());
      }

      // 고양시 화장실이 전부 보이도록 지도 범위 맞추기
      if (GOYANG_TOILETS.length > 0) {
        map.setBounds(bounds);
      }

      document.getElementById("countText").textContent =
        "화장실 " + GOYANG_TOILETS.length + "곳 표시 중 (학교 제외)";

      // 지도의 빈 곳을 누르면 팝업 닫기
      kakao.maps.event.addListener(map, "click", function () {
        infoWindow.close();
      });

      // 내 위치 버튼
      document.getElementById("myLocationButton").addEventListener("click", moveToMyLocation);
    }

    // ============================================================
    // 4. 화장실 마커 만들기
    // ============================================================
    function addToiletMarker(toilet) {
      // 시뮬레이션: 이 화장실의 변기 상태를 정해요 (같은 화장실은 항상 같은 결과)
      toilet.simulation = makeSimulation(toilet);

      var marker = new kakao.maps.Marker({
        map: map,
        position: new kakao.maps.LatLng(toilet.lat, toilet.lng),
        // 마우스를 올리면 이름과 이용 가능한 변기 수가 작게 보여요
        title: toilet.name + " (이용 가능 " + toilet.simulation.freeTotal + "/" + toilet.simulation.total + ")"
      });

      kakao.maps.event.addListener(marker, "click", function () {
        openPopup(toilet, marker);
      });
      return marker;
    }

    // 화장실 하나의 시뮬레이션 결과 만들기
    function makeSimulation(toilet) {
      var random = makeRandom(toilet.name + toilet.lat);

      // 변기 수가 없는 화장실은 2~5칸으로 가정
      var maleCount = toilet.maleStalls > 0 ? toilet.maleStalls : 2 + Math.floor(random() * 4);
      var femaleCount = toilet.femaleStalls > 0 ? toilet.femaleStalls : 2 + Math.floor(random() * 4);

      var male = makeStallStates(maleCount, random);
      var female = makeStallStates(femaleCount, random);

      return {
        male: male,
        female: female,
        total: male.length + female.length,
        freeTotal: countFree(male) + countFree(female)
      };
    }

    // 변기 칸마다 사용 가능(true) / 사용 중(false) 정하기
    function makeStallStates(count, random) {
      var states = [];
      for (var i = 0; i < count; i++) {
        states.push(random() > 0.45);    // 약 55% 확률로 사용 가능
      }
      return states;
    }

    // 사용 가능한 칸 개수 세기
    function countFree(states) {
      var free = 0;
      for (var i = 0; i < states.length; i++) {
        if (states[i]) {
          free++;
        }
      }
      return free;
    }

    // 이름으로 같은 난수를 만드는 함수 (같은 화장실은 항상 같은 결과가 나와요)
    function makeRandom(seedText) {
      var seed = 0;
      for (var i = 0; i < seedText.length; i++) {
        seed = (seed * 31 + seedText.charCodeAt(i)) % 2147483647;
      }
      if (seed === 0) {
        seed = 1;
      }
      return function () {
        seed = (seed * 16807) % 2147483647;
        return seed / 2147483647;
      };
    }

    // ============================================================
    // 6. 마커 팝업
    // ============================================================
    function openPopup(toilet, marker) {
      var popup = document.createElement("div");
      popup.className = "popup";

      // 이름
      var title = document.createElement("div");
      title.className = "popup-title";
      title.textContent = toilet.name;
      popup.appendChild(title);

      // 주소 (처음 열 때 카카오에서 좌표로 주소를 찾아와요)
      var address = document.createElement("div");
      address.className = "popup-address";
      address.textContent = toilet.address !== "" ? toilet.address : "주소를 불러오는 중...";
      popup.appendChild(address);

      if (toilet.address === "") {
        loadAddress(toilet, address);
      }

      // 전체 이용 가능 변기 수
      var summary = document.createElement("div");
      summary.className = "popup-section";
      summary.textContent = "이용 가능한 변기: " + toilet.simulation.freeTotal + " / " + toilet.simulation.total + "칸";
      popup.appendChild(summary);

      // 남성 / 여성 변기 칸 상자
      popup.appendChild(makeStallSection("남성", toilet.simulation.male));
      popup.appendChild(makeStallSection("여성", toilet.simulation.female));

      // 안내 문구
      var note = document.createElement("div");
      note.className = "popup-note";
      note.textContent = "※ 이용 가능 여부는 임의로 만든 시뮬레이션이에요. (초록: 사용 가능, 빨강: 사용 중)";
      popup.appendChild(note);

      infoWindow.setContent(popup);
      infoWindow.open(map, marker);
    }

    // 변기 칸 상자들 만들기 (너무 많으면 12칸까지만 그려요)
    function makeStallSection(label, states) {
      var wrapper = document.createElement("div");

      var heading = document.createElement("div");
      heading.textContent = label + " " + countFree(states) + "/" + states.length + " 사용 가능";
      wrapper.appendChild(heading);

      var row = document.createElement("div");
      row.className = "stall-row";

      for (var i = 0; i < states.length && i < 12; i++) {
        var stall = document.createElement("div");
        stall.className = "stall " + (states[i] ? "free" : "busy");
        stall.textContent = i + 1;
        stall.title = (i + 1) + "번 칸: " + (states[i] ? "사용 가능" : "사용 중");
        row.appendChild(stall);
      }

      wrapper.appendChild(row);
      return wrapper;
    }

    // 좌표로 주소를 찾아서 팝업에 채워 넣기
    function loadAddress(toilet, addressElement) {
      geocoder.coord2Address(toilet.lng, toilet.lat, function (result, status) {
        if (status === kakao.maps.services.Status.OK && result.length > 0) {
          var found = result[0];
          toilet.address = found.road_address ? found.road_address.address_name : found.address.address_name;
          addressElement.textContent = toilet.address;
        } else {
          addressElement.textContent = "주소 정보를 찾지 못했어요";
        }
      });
    }

    // ============================================================
    // 7. 내 위치로 이동 (확대 레벨 5)
    // ============================================================
    function moveToMyLocation() {
      if (!navigator.geolocation) {
        alert("이 브라우저는 위치 기능을 지원하지 않아요.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (position) {
          var myPosition = new kakao.maps.LatLng(position.coords.latitude, position.coords.longitude);
          map.setLevel(5);
          map.setCenter(myPosition);
        },
        function () {
          alert("위치 권한을 허용해 주세요. (https 주소나 localhost 에서만 동작해요)");
        }
      );
    }
  </script>
