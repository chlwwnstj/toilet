<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화장실 찾기 서비스</title>

  <style>
    /* 기본 여백 제거 */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }

    /* 화면 2분할: 왼쪽(탭+리스트) + 오른쪽(지도) */
    #container { display: flex; width: 100%; height: 100%; }

    /* 왼쪽 영역 */
    #sidebar {
      width: 360px;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ddd;
      background: #ffffff;
    }

    /* 탭 버튼 영역 */
    #tabBar { display: flex; border-bottom: 2px solid #eee; }

    .tab-button {
      flex: 1;
      padding: 14px 8px;
      font-size: 15px;
      color: #666;
      background: #fafafa;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
    }

    .tab-button.active {
      color: #2563eb;
      font-weight: bold;
      background: #ffffff;
      border-bottom-color: #2563eb;
    }

    /* 지역명 검색창 (탭 2에서만 보임) */
    #searchForm { display: none; gap: 6px; padding: 12px 14px; border-bottom: 1px solid #eee; }
    #searchForm.visible { display: flex; }

    #regionInput {
      flex: 1;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    #searchButton {
      padding: 10px 16px;
      font-size: 15px;
      color: #fff;
      background: #3b82f6;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #searchButton:hover { background: #2563eb; }

    /* 검색 결과 리스트 (넘치면 스크롤) */
    #resultList { flex: 1; overflow-y: auto; list-style: none; }

    #resultList li {
      padding: 12px 14px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }

    #resultList li:hover { background: #f5f8ff; }

    .place-name { font-size: 15px; font-weight: bold; margin-bottom: 4px; }
    .place-address { font-size: 13px; color: #666; }
    .place-extra { font-size: 12px; color: #3b82f6; margin-top: 2px; }

    #resultList li.message {
      padding: 14px;
      color: #666;
      font-size: 13px;
      background: #f8fafc;
      cursor: default;
    }

    /* 페이지 번호 */
    #pagination {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 10px;
      border-top: 1px solid #eee;
    }

    #pagination:empty { display: none; }

    #pagination a {
      padding: 4px 9px;
      font-size: 13px;
      color: #333;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
    }

    #pagination a.current {
      color: #fff;
      background: #3b82f6;
      border-color: #3b82f6;
      font-weight: bold;
      cursor: default;
    }

    /* 오른쪽 지도 영역 */
    #mapArea { position: relative; flex: 1; height: 100%; }
    #map { width: 100%; height: 100%; }

    /* 내 위치 파란 점 */
    .my-dot {
      width: 16px;
      height: 16px;
      background: #2563eb;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.4);
    }

    /* 로드뷰 패널 (지도 아래쪽에 겹쳐서 표시) */
    #roadviewPanel {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 50%;
      z-index: 10;
      background: #000;
      border-top: 3px solid #2563eb;
    }

    #roadviewPanel.visible { display: block; }
    #roadview { width: 100%; height: 100%; }

    #roadviewClose {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 11;
      padding: 6px 12px;
      font-size: 13px;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #fff;
      border-radius: 4px;
      cursor: pointer;
    }

    #roadviewMessage {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      text-align: center;
      color: #fff;
      font-size: 15px;
    }

    /* 마커 팝업 (말풍선) 안쪽 스타일 */
    .popup { width: 250px; padding: 12px; font-size: 13px; line-height: 1.5; }
    .popup-title { font-size: 15px; font-weight: bold; margin-bottom: 2px; }
    .popup-address { color: #666; margin-bottom: 6px; }
    .popup-section { margin-top: 8px; font-weight: bold; }
    .stall-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }

    .stall {
      width: 24px;
      height: 24px;
      line-height: 24px;
      text-align: center;
      font-size: 12px;
      color: #fff;
      border-radius: 4px;
    }

    .stall.free { background: #22c55e; }
    .stall.busy { background: #ef4444; }
    .popup-note { margin-top: 8px; font-size: 11px; color: #999; }

    .popup-roadview {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      font-size: 13px;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
